<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  <title>Gelände Satellit</title>
  <link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
    crossorigin=""
  />
  <style>
    html, body, #map { margin: 0; padding: 0; height: 100%; background: #000; }
    .leaflet-control-attribution {
      font-size: 8px !important;
      opacity: 0.6;
      background: rgba(0,0,0,0.5) !important;
      color: #aaa !important;
    }
    .leaflet-control-attribution a { color: #ccc !important; }
    .leaflet-bar {
      background: rgba(0,0,0,0.7) !important;
      border: 1px solid rgba(255,255,255,0.1) !important;
    }
    .leaflet-bar a {
      background: rgba(0,0,0,0.7) !important;
      color: #fff !important;
      border-bottom: 1px solid rgba(255,255,255,0.1) !important;
    }
    .leaflet-bar a:hover {
      background: rgba(255,255,255,0.1) !important;
    }
    .pending-marker {
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.2); }
    }
  </style>
</head>
<body>
  <div id="map"></div>
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" crossorigin=""></script>
  <script>
    const map = L.map('map', {
      center: [46.9695, 7.4413],
      zoom: 18,
      maxZoom: 19,
      minZoom: 16,
      zoomControl: true,
    });

    L.tileLayer(
      'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
      {
        attribution: '&copy; Esri',
        maxZoom: 19,
      }
    ).addTo(map);

    function makePinIcon(title, isPending) {
      const color = isPending ? '#10b981' : '#fbbf24';
      const labelBg = isPending ? 'rgba(16,185,129,0.95)' : 'rgba(255,220,50,0.95)';
      const labelColor = isPending ? '#fff' : '#000';
      const cls = isPending ? 'pending-marker' : '';
      return L.divIcon({
        className: '',
        html: `<div style="display:flex;flex-direction:column;align-items:center;transform:translate(-50%,-100%)" class="${cls}">
          <div style="background:${labelBg};color:${labelColor};font-size:10px;font-weight:700;padding:2px 6px;border-radius:4px;max-width:130px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;box-shadow:0 2px 6px rgba(0,0,0,0.6)">${title}</div>
          <div style="width:0;height:0;border-left:4px solid transparent;border-right:4px solid transparent;border-top:4px solid ${labelBg}"></div>
          <div style="width:10px;height:10px;border-radius:50%;background:${color};border:2px solid #000;margin-top:-1px;box-shadow:0 0 8px ${color}"></div>
        </div>`,
        iconSize: [0, 0],
        iconAnchor: [0, 0],
      });
    }

    // Existing pins (from tasks)
    let markers = [];
    // Draggable pending pin (when creating a task)
    let pendingMarker = null;

    window.addEventListener('message', (event) => {
      if (event.data.type === 'setPins') {
        markers.forEach(m => m.remove());
        markers = [];
        event.data.pins.forEach(pin => {
          const marker = L.marker([pin.lat, pin.lng], {
            icon: makePinIcon(pin.title, false),
          }).addTo(map);
          markers.push(marker);
        });
      } else if (event.data.type === 'setPendingPin') {
        if (pendingMarker) {
          pendingMarker.remove();
          pendingMarker = null;
        }
        if (event.data.pin) {
          pendingMarker = L.marker([event.data.pin.lat, event.data.pin.lng], {
            icon: makePinIcon('Neu', true),
            draggable: true,
          }).addTo(map);
          pendingMarker.on('dragend', (e) => {
            const pos = e.target.getLatLng();
            window.parent.postMessage({
              type: 'pinMoved',
              lat: pos.lat,
              lng: pos.lng,
            }, '*');
          });
        }
      } else if (event.data.type === 'clearPendingPin') {
        if (pendingMarker) {
          pendingMarker.remove();
          pendingMarker = null;
        }
      }
    });

    // Klicks auf die Karte an Parent weiterleiten
    map.on('click', (e) => {
      window.parent.postMessage({
        type: 'mapClick',
        lat: e.latlng.lat,
        lng: e.latlng.lng,
      }, '*');
    });

    // Ready signal
    setTimeout(() => {
      window.parent.postMessage({ type: 'mapReady' }, '*');
    }, 200);
  </script>
</body>
</html>
