name: Build and Deploy

on:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Volle Historie, damit wir im Summary den Diff zum
          # vorherigen main-Stand zeigen koennen.
          fetch-depth: 0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/daellengarnier/via1-app:latest
            ghcr.io/daellengarnier/via1-app:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build summary
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          SHA: ${{ github.sha }}
          BEFORE: ${{ github.event.before }}
          STATUS: ${{ job.status }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          SHORT="${SHA:0:7}"
          {
            echo "## $ICON Build — $STATUS"
            echo ""
            echo "**Commit:** [\`$SHORT\`]($REPO_URL/commit/$SHA)"
            echo "**Autor:** $AUTHOR"
            echo ""
            echo "**Nachricht:**"
            echo ""
            echo '```'
            echo "$COMMIT_MSG"
            echo '```'
            if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
              echo ""
              echo "### Geänderte Dateien"
              echo ""
              echo '```'
              git diff --stat "$BEFORE..$SHA" 2>/dev/null || echo "(Diff nicht verfügbar)"
              echo '```'
              echo ""
              echo "### Commits in diesem Push"
              echo ""
              git log --pretty=format:"- \`%h\` %s — _%an_" "$BEFORE..$SHA" 2>/dev/null || git log -1 --pretty=format:"- \`%h\` %s — _%an_"
              echo ""
            fi
          } >> "$GITHUB_STEP_SUMMARY"

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 20m
          script: |
            cd /opt/via1-app
            git fetch origin main && git reset --hard origin/main
            docker pull ghcr.io/daellengarnier/via1-app:latest && \
            docker compose up -d && \
            docker compose restart nginx && \
            docker image prune -f
            echo "Deploy done"

      - name: Deploy summary
        if: always()
        env:
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          AUTHOR: ${{ github.event.head_commit.author.name }}
          SHA: ${{ github.sha }}
          STATUS: ${{ job.status }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          ICON="✅"
          [ "$STATUS" != "success" ] && ICON="❌"
          SHORT="${SHA:0:7}"
          {
            echo "## $ICON Deploy — $STATUS"
            echo ""
            if [ "$STATUS" = "success" ]; then
              echo "🌐 **Live:** https://app.felsenau.org"
              echo ""
            fi
            echo "**Commit:** [\`$SHORT\`]($REPO_URL/commit/$SHA)"
            echo "**Autor:** $AUTHOR"
            echo ""
            echo "**Nachricht:**"
            echo ""
            echo '```'
            echo "$COMMIT_MSG"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
