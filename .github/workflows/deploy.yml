name: Deploy to VPS

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /opt/via1-app
            git pull origin main
            DOCKER_BUILDKIT=1 docker compose build --build-arg CACHEBUST=$(date +%s) app
            docker compose up -d
            docker compose restart nginx
