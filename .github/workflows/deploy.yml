name: Build and Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: daellengarnier/via1-app

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ghcr.io/daellengarnier/via1-app:latest
            ghcr.io/daellengarnier/via1-app:${{ github.sha }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          command_timeout: 5m
          script: |
            set -e
            cd /opt/via1-app

            # Pull latest code (for docker-compose.yml, nginx config, .env)
            git fetch origin main
            git reset --hard origin/main
            echo "Commit: $(git log --oneline -1)"

            # Pull the pre-built image (public, no login needed)
            docker pull ghcr.io/daellengarnier/via1-app:latest

            # Restart with the new image
            docker compose up -d
            docker compose restart nginx

            echo "Deploy done"
